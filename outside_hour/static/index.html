<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outside Hour</title>
<style>
  :root {
    --bg: #f4f1e8; --ink: #1d2a1f; --muted: #5b6a5d; --card: #fffdf6; --line: #d9d3c2;
    --accent: #2f6b3a; --accent-ink: #ffffff; --warn: #8a4b00; --warn-bg: #fff1dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 28px; margin: 4px 0 2px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input[type=time] { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line);
         border-radius: 10px; background: var(--card); color: var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 9px 14px; font: inherit; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .go { width: 100%; margin-top: 22px; padding: 15px; font: 600 18px system-ui, sans-serif; border: 0;
        border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .go:disabled { opacity: .6; }
  .clock { position: fixed; top: 10px; right: 12px; font: 600 13px ui-monospace, monospace; color: var(--muted);
           background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .status { margin-top: 14px; color: var(--muted); min-height: 1.4em; }
  .err { color: #9b1c1c; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 18px; }
  .card h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.25; }
  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; text-align: center; }
  .times div { background: var(--bg); border-radius: 10px; padding: 8px 4px; }
  .times b { display: block; font-size: 22px; }
  .times span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 16px 0 4px; }
  .card ul { margin: 0; padding-left: 20px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .meta a { color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .actions button { padding: 12px; font: 600 15px system-ui, sans-serif; border-radius: 10px; cursor: pointer;
                    border: 1px solid var(--accent); background: var(--card); color: var(--accent); }
  .actions .primary { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); font-size: 17px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e6efe3;
           color: var(--accent); font-weight: 600; }
  .badge.t { background: #eee; color: #555; }
  /* Phone-down view: dark, huge, nothing to scroll. */
  #down { display: none; position: fixed; inset: 0; background: #000; color: #eaeaea; padding: 28px 22px;
          flex-direction: column; justify-content: center; text-align: center; }
  #down.on { display: flex; }
  #down .big { font-size: 64px; font-weight: 700; letter-spacing: -1px; margin: 8px 0; color: #fff; }
  #down .place { font-size: 24px; margin-bottom: 18px; }
  #down .small { color: #9a9a9a; font-size: 16px; }
  #down button { align-self: center; margin-top: 28px; background: none; color: #777; border: 1px solid #333; border-radius: 999px;
                 padding: 8px 16px; font: inherit; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121611; --ink: #e8eadf; --muted: #a2ab9d; --card: #1b211a;
      --line: #2e372c; --accent: #79b886; --accent-ink: #0d140e; --warn: #ffcf8a; --warn-bg: #3a2a12; }
    :root:not([data-theme="light"]) .badge { background: #233024; }
  }
  :root[data-theme="dark"] { --bg: #121611; --ink: #e8eadf; --muted: #a2ab9d; --card: #1b211a;
      --line: #2e372c; --accent: #79b886; --accent-ink: #0d140e; --warn: #ffcf8a; --warn-bg: #3a2a12; }
  @media print {
    body { background: #fff; color: #000; font-size: 12px; }
    .clock, #form, .actions, .status, header { display: none !important; }
    main { padding: 0; }
    .card { border: 1px dashed #000; width: 105mm; break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="clock" id="clock" title="Time spent on this screen">screen 0:00</div>
<main>
  <header>
    <h1>Outside Hour</h1>
    <p class="sub">Tell it where you are and how long you have. Get one plan, then put the phone away.</p>
  </header>

  <section id="form">
    <label for="near">Where are you starting?</label>
    <input id="near" type="text" placeholder="A place name, or tap a demo start below" autocomplete="off">
    <div class="row" style="margin-top:8px" id="presets"></div>
    <div class="row" style="margin-top:8px"><button class="chip" id="geo" type="button">Use my location</button></div>

    <label>How long do you have?</label>
    <div class="row" id="mins">
      <button class="chip" type="button" data-v="30">30 min</button>
      <button class="chip" type="button" data-v="45">45 min</button>
      <button class="chip" type="button" data-v="60" aria-pressed="true">60 min</button>
      <button class="chip" type="button" data-v="90">90 min</button>
    </div>

    <label for="start">When?</label>
    <div class="row">
      <button class="chip" type="button" id="now" aria-pressed="true">Now</button>
      <span style="align-self:center;color:var(--muted)">or later, at</span>
      <input id="start" type="time" style="width:auto" aria-label="Later, at">
    </div>

    <button class="go" id="go">Plan my outside hour</button>
    <div class="status" id="status" role="status"></div>
  </section>

  <div id="out"></div>
</main>

<div id="down" aria-live="polite">
  <div class="small">Go to</div>
  <div class="place" id="d-place"></div>
  <div class="small">Turn back at</div>
  <div class="big" id="d-turn"></div>
  <div class="small" id="d-back"></div>
  <div class="small" id="d-screen" style="margin-top:22px"></div>
  <button id="d-exit" type="button">show the full card</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const t0 = Date.now();
let frozen = null, minutes = 60, loc = null, plan = null;

function fmt(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
setInterval(() => { $("clock").textContent = "screen " + fmt((frozen ?? Date.now()) - t0); }, 500);

fetch("/api/health").then(r => r.json()).then(h => {
  for (const [k, label] of Object.entries(h.presets)) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = label.replace(" (demo start)", "");
    b.onclick = () => {
      loc = { preset: k }; $("near").value = label;
      for (const x of $("presets").querySelectorAll("button")) x.setAttribute("aria-pressed", x === b);
    };
    $("presets").appendChild(b);
  }
  if (!h.model_ok) $("status").textContent = "Local model not running: plans will use the plain template.";
}).catch(() => {});

$("near").addEventListener("input", () => {
  loc = null; for (const x of $("presets").querySelectorAll("button")) x.setAttribute("aria-pressed", false);
});
$("geo").onclick = () => {
  if (!navigator.geolocation) return;
  $("status").textContent = "Asking your browser for location…";
  navigator.geolocation.getCurrentPosition(p => {
    loc = { lat: p.coords.latitude.toFixed(4), lon: p.coords.longitude.toFixed(4), label: "your location" };
    $("near").value = "your location"; $("status").textContent = "";
  }, () => { $("status").textContent = "Location not available; type a place instead."; });
};
for (const b of $("mins").querySelectorAll("button")) b.onclick = () => {
  minutes = +b.dataset.v;
  for (const x of $("mins").querySelectorAll("button")) x.setAttribute("aria-pressed", x === b);
};
$("now").onclick = () => { $("start").value = ""; $("now").setAttribute("aria-pressed", true); };
$("start").oninput = () => $("now").setAttribute("aria-pressed", !$("start").value);

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("go").onclick = async () => {
  const q = new URLSearchParams({ minutes });
  if (loc) for (const [k, v] of Object.entries(loc)) q.set(k, v);
  else if ($("near").value.trim()) q.set("near", $("near").value.trim());
  else { $("status").textContent = "Tell me where you're starting."; return; }
  if ($("start").value) q.set("start", $("start").value);
  $("go").disabled = true; $("out").innerHTML = "";
  const steps = ["Checking the weather and sunset…", "Finding parks, water and viewpoints on OpenStreetMap…",
                 "Gemma is writing your card on this computer…"];
  const started = Date.now();
  $("status").className = "status"; $("status").textContent = steps[0];
  const tick = setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    $("status").textContent = `${steps[Math.min(Math.floor(s / 2), steps.length - 1)]} ${s} s`;
  }, 500);
  try {
    const r = await fetch("/api/plan?" + q);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "failed");
    plan = d; render(d); $("status").textContent = "";
  } catch (e) {
    $("status").className = "status err"; $("status").textContent = e.message;
  } finally { clearInterval(tick); $("go").disabled = false; }
};

function render(p) {
  const wx = p.weather, s = p.model_stats || {};
  const by = p.writer === "template"
    ? `<span class="badge t">plain template</span>`
    : `<span class="badge">written by ${esc(p.writer)}</span>`;
  const speed = s.wall_s ? ` · ${s.output_tokens} tokens in ${s.wall_s}s on CPU` : "";
  const rej = (p.rejected || []).map(r => `<div class="meta">Model draft rejected by the checker: ${esc(r)}</div>`).join("");
  $("out").innerHTML = `
  <article class="card" id="card">
    <h2>${esc(p.headline)}</h2>
    <div>${by}</div>
    <div class="times">
      <div><b>${esc(p.now)}</b><span>leave</span></div>
      <div><b>${esc(p.turn_around)}</b><span>turn back</span></div>
      <div><b>${esc(p.back_by)}</b><span>back</span></div>
    </div>
    ${(p.warnings || []).map(w => `<div class="warn">${esc(w)}</div>`).join("")}
    <p style="margin:6px 0">${esc(p.route)}</p>
    <p style="margin:6px 0">${esc(p.why)}</p>
    <h3>Notice</h3><ul>${p.notice.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
    <h3>Bring</h3><ul>${p.bring.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
    <h3>Weather</h3>
    <div>${esc(wx.sky)}, ${Math.round(wx.temp_c)}°C (feels ${Math.round(wx.feels_like_c)}°C), rain ${wx.rain_chance_pct}%,
      wind ${Math.round(wx.wind_kmh)} km/h${wx.us_aqi != null ? `, US AQI ${wx.us_aqi}` : ""}. Sunset ${esc(wx.sunset)}.</div>
    <p style="margin-top:14px;font-weight:600">${esc(p.phone_down_line)}</p>
    <div class="meta">${esc(p.date)} · from ${esc(p.start_label)} ·
      <a href="${esc(p.place.osm_url)}" target="_blank" rel="noopener">${esc(p.place.name)} on OpenStreetMap</a>${speed}</div>
    ${rej}
    <div class="meta">${esc(p.attribution)}</div>
  </article>
  <div class="actions">
    <button class="primary" id="b-down">Phone down</button>
    <button id="b-print">Print pocket card</button>
    <button id="b-ics">Turn-back alarm (.ics)</button>
  </div>`;
  $("b-down").onclick = phoneDown;
  $("b-print").onclick = () => window.print();
  $("b-ics").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([p.ics], { type: "text/calendar" }));
    a.download = "outside-hour.ics"; a.click();
  };
  $("card").scrollIntoView({ behavior: "smooth", block: "start" });
}

function phoneDown() {
  frozen = Date.now();
  $("d-place").textContent = plan.place.name;
  $("d-turn").textContent = plan.turn_around;
  $("d-back").textContent = "Back by " + plan.back_by;
  $("d-screen").textContent = `You spent ${fmt(frozen - t0)} on this screen. That's enough. Lock the phone and go.`;
  $("down").classList.add("on");
}
$("d-exit").onclick = () => $("down").classList.remove("on");
</script>
</body>
</html>
